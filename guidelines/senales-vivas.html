<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;font-family:var(--font-sans);background:var(--bg-grad) fixed;color:var(--tp)}.g{display:flex;gap:40px;align-items:center}.i{display:flex;align-items:center;gap:12px}.d{position:relative;width:9px;height:9px;flex:none}.d span{position:absolute;inset:0;border-radius:999px}.d .p{animation:ih-pulse 2.4s cubic-bezier(.22,1,.36,1) infinite}.t{font-size:12.5px;font-weight:600}.s{font-size:10.5px;color:var(--tt);display:block;font-weight:400;margin-top:2px}</style>
</head><body>
<div class="g">
<div class="i"><span class="d"><span style="background:var(--verde)"></span><span class="p" style="background:var(--verde)"></span></span><span class="t">Asistente activo<span class="s">Dot vivo de la isla · ih-pulse 2.4s</span></span></div>
<div class="i"><span class="d"><span style="background:var(--ambar)"></span><span class="p" style="background:var(--ambar)"></span></span><span class="t">Sin atender +24 h<span class="s">Urgencia: respira, no invita a tocar</span></span></div>
<div class="i"><span class="d"><span style="background:var(--gol)"></span></span><span class="t">Gol del asistente<span class="s">Plano — el gol ya pasó, no espera nada</span></span></div>
</div>
<p style="margin:16px 0 0;font-size:11px;color:var(--tt);line-height:1.5">Prohibida la respiración en reposo en botones y tarjetas. <b>prefers-reduced-motion</b> apaga todo y deja el frame estático.</p>
</body></html>
