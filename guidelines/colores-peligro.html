<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;font-family:var(--font-sans);background:var(--bg-grad) fixed;color:var(--tp)}.g{display:flex;gap:14px}.k{flex:1;border-radius:14px;padding:14px 16px;font-size:12px;line-height:1.5}.n{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:6px}</style>
</head><body>
<div class="g">
<div class="k" style="background:var(--warn-bg);color:var(--warn)"><span class="n">--warn / --warn-bg</span>No pudimos leer 2 mensajes de la campaña. Ya lo estamos revisando.</div>
<div class="k" style="background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-bd)"><span class="n">--danger / -bg / -bd</span>No se pudo sincronizar el catálogo con la ingesta.</div>
</div>
<p style="margin:14px 0 0;font-size:11px;color:var(--tt);line-height:1.5">Las acciones destructivas usan el negro/crema del sistema (<b>--btn-bg</b>) y una confirmación centrada con blur. Cero rojo en confirmaciones.</p>
</body></html>
