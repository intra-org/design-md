<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;font-family:var(--font-sans);background:var(--bg-grad) fixed;color:var(--tp)}.g{display:flex;gap:10px;flex-wrap:wrap}.s{display:flex;flex-direction:column;gap:6px;width:98px}.b{height:52px;border-radius:10px;border:1px solid var(--divider)}.n{font-size:10.5px;font-weight:600}.h{font-size:9.5px;color:var(--tt);font-variant-numeric:tabular-nums}</style>
</head><body>
<div class="g">
<div class="s"><div class="b" style="background:var(--card)"></div><span class="n">--card</span><span class="h">#FFFFFF</span></div>
<div class="s"><div class="b" style="background:var(--scrim)"></div><span class="n">--scrim</span><span class="h">#FAF9F5</span></div>
<div class="s"><div class="b" style="background:var(--nav-bg)"></div><span class="n">--nav-bg</span><span class="h">#F7F5EF</span></div>
<div class="s"><div class="b" style="background:var(--tonal)"></div><span class="n">--tonal</span><span class="h">#F1EFE8</span></div>
<div class="s"><div class="b" style="background:var(--hover)"></div><span class="n">--hover</span><span class="h">#F7F5EF</span></div>
<div class="s"><div class="b" style="background:var(--divider)"></div><span class="n">--divider</span><span class="h">#EFECE4</span></div>
<div class="s"><div class="b" style="background:var(--sec-bd)"></div><span class="n">--sec-bd</span><span class="h">#D9D5CC</span></div>
</div>
</body></html>
