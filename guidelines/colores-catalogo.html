<!-- @dsCard group="Colors" viewport="700x150" name="Paleta del catálogo" subtitle="Los 9 colores que el hotelero asigna a un producto — distinguen, nunca significan" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;font-family:var(--font-sans);background:var(--bg-grad) fixed;color:var(--tp)}.g{display:flex;gap:8px}.s{display:flex;flex-direction:column;gap:6px;align-items:center;flex:1}.b{width:100%;height:44px;border-radius:10px}.n{font-size:9.5px;color:var(--tt)}.chips{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--chip-tx)}.cd{width:6px;height:6px;border-radius:999px}</style>
</head><body>
<div class="g">
<div class="s"><div class="b" style="background:var(--chip-1)"></div><span class="n">1</span></div>
<div class="s"><div class="b" style="background:var(--chip-2)"></div><span class="n">2</span></div>
<div class="s"><div class="b" style="background:var(--chip-3)"></div><span class="n">3</span></div>
<div class="s"><div class="b" style="background:var(--chip-4)"></div><span class="n">4</span></div>
<div class="s"><div class="b" style="background:var(--chip-5)"></div><span class="n">5</span></div>
<div class="s"><div class="b" style="background:var(--chip-6)"></div><span class="n">6</span></div>
<div class="s"><div class="b" style="background:var(--chip-7)"></div><span class="n">7</span></div>
<div class="s"><div class="b" style="background:var(--chip-8)"></div><span class="n">8</span></div>
<div class="s"><div class="b" style="background:var(--chip-9)"></div><span class="n">9</span></div>
</div>
<div class="chips">
<span class="chip" style="background:var(--chip-bg-1)"><span class="cd" style="background:var(--chip-1)"></span>Reservas</span>
<span class="chip" style="background:var(--chip-bg-3)"><span class="cd" style="background:var(--chip-3)"></span>Day Pass</span>
<span class="chip" style="background:var(--chip-bg-6)"><span class="cd" style="background:var(--chip-6)"></span>Bodas</span>
<span class="chip" style="background:var(--chip-bg-9)"><span class="cd" style="background:var(--chip-9)"></span>Spa</span>
</div>
</body></html>
