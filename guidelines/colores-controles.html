<!-- @dsCard group="Colors" viewport="700x150" name="Controles" subtitle="Botones, segmented y switch: el peso lo da el token, no un color nuevo" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;font-family:var(--font-sans);background:var(--bg-grad) fixed;color:var(--tp)}.g{display:flex;gap:10px;flex-wrap:wrap}.s{display:flex;flex-direction:column;gap:6px;width:104px}.b{height:48px;border-radius:10px;border:1px solid var(--divider);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}.n{font-size:10px;font-weight:600}.h{font-size:9.5px;color:var(--tt)}</style>
</head><body>
<div class="g">
<div class="s"><div class="b" style="background:var(--btn-bg);color:var(--btn-tx)">Atender</div><span class="n">--btn-bg</span><span class="h">tinta / crema</span></div>
<div class="s"><div class="b" style="background:transparent;border-color:var(--sec-bd)">Outline</div><span class="n">--sec-bd</span><span class="h">borde secundario</span></div>
<div class="s"><div class="b" style="background:var(--seg-track)"></div><span class="n">--seg-track</span><span class="h">pista</span></div>
<div class="s"><div class="b" style="background:var(--seg-thumb)"></div><span class="n">--seg-thumb</span><span class="h">thumb</span></div>
<div class="s"><div class="b" style="background:var(--sw-off)"></div><span class="n">--sw-off</span><span class="h">switch apagado</span></div>
<div class="s"><div class="b" style="background:var(--input-bg)"></div><span class="n">--input-bg</span><span class="h">campo</span></div>
</div>
</body></html>
