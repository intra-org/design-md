<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;font-family:var(--font-sans);background:var(--bg-grad) fixed;color:var(--tp)}.g{display:flex;gap:40px}.col{display:flex;flex-direction:column;gap:4px}.k{font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--tt);margin-bottom:4px}.t{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}.p{font-size:15px;font-weight:600;font-variant-numeric:proportional-nums}</style>
</head><body>
<div class="g">
<div class="col"><span class="k">Tabular · producto</span><span class="t">9:41 AM</span><span class="t">11:00 AM</span><span class="t">$86,400 MXN</span><span class="t">$12,800</span></div>
<div class="col"><span class="k">Proporcional · solo display</span><span class="p">22</span><span class="p">$86,400</span></div>
<div class="col" style="flex:1"><span class="k">Reglas</span><span style="font-size:11.5px;line-height:1.6;color:var(--ts)">Los decimales van del MISMO color que el entero.<br>MXN solo en la primera mención de cada tarjeta.<br>Estadística honesta: mediana, no promedio; todo estimado se etiqueta “estimado”.</span></div>
</div>
</body></html>
